<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Smart Pet Feeder Dashboard</title>
  <!-- Thư viện MQTT.js kết nối trực tiếp từ trình duyệt -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .dashboard { background: #ffffff; width: 420px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #1a202c; margin-top: 0; margin-bottom: 5px; }
    .conn-status { text-align: center; font-size: 13px; margin-bottom: 20px; font-weight: 600; color: #e53e3e; }
    .conn-status.online { color: #38a169; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .card { background: #f7fafc; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #edf2f7; }
    .card-title { font-size: 13px; color: #718096; margin-bottom: 8px; }
    .card-value { font-size: 26px; font-weight: bold; color: #2d3748; }
    .status-box { background: #ebf8ff; color: #2b6cb0; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; border: 1px solid #bee3f8; }
    .btn-group { display: flex; gap: 12px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
    .btn-feed { background: #38a169; }
    .btn-feed:hover { background: #2f855a; }
    .btn-stop { background: #e53e3e; }
    .btn-stop:hover { background: #c53030; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>

<div class="dashboard">
  <h2>🐾 Smart Pet Feeder IoT</h2>
  <div id="connStatus" class="conn-status">● Đang kết nối máy chủ MQTT...</div>

  <div class="card-grid">
    <div class="card">
      <div class="card-title">Lượng hạt trong bình</div>
      <div class="card-value"><span id="foodVal">--</span>%</div>
    </div>
    <div class="card">
      <div class="card-title">Trọng lượng bát ăn</div>
      <div class="card-value"><span id="weightVal">--</span>g</div>
    </div>
  </div>

  <div class="status-box" id="sysStatus">TRẠNG THÁI: ĐANG CHỜ DỮ LIỆU</div>

  <div class="btn-group">
    <button class="btn-feed" onclick="sendCommand('FEED')">🍖 CHO ĂN NGAY</button>
    <button class="btn-stop" onclick="sendCommand('STOP')">🛑 DỪNG KHẨN CẤP</button>
  </div>
</div>

<script>
  // Phải khớp hoàn toàn với Topic trong code ESP32
  const topicSub = "huita/petfeeder/status_998877";
  const topicPub = "huita/petfeeder/cmd_998877";

  // Kết nối tới EMQX Public Broker qua WebSocket (cổng 8083)
  const client = mqtt.connect("ws://broker.emqx.io:8083/mqtt");

  client.on("connect", () => {
    const statusEl = document.getElementById("connStatus");
    statusEl.innerText = "● Đã kết nối hệ thống IoT";
    statusEl.classList.add("online");
    client.subscribe(topicSub);
  });

  client.on("message", (topic, message) => {
    if (topic === topicSub) {
      try {
        const data = JSON.parse(message.toString());
        document.getElementById("foodVal").innerText = data.food;
        document.getElementById("weightVal").innerText = data.weight;
        document.getElementById("sysStatus").innerText = "TRẠNG THÁI: " + data.status;
      } catch (e) {
        console.error("Lỗi phân tích JSON:", e);
      }
    }
  });

  function sendCommand(cmd) {
    if (client.connected) {
      client.publish(topicPub, cmd);
      console.log("Đã gửi lệnh:", cmd);
    } else {
      alert("Chưa kết nối được tới máy chủ MQTT!");
    }
  }
</script>

</body>
</html>
