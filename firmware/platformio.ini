[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Sử dụng hệ thống file LittleFS trên Flash để làm Offline Ring Buffer (SV2)
board_build.filesystem = littlefs
; App đơn 2 MiB để vượt giới hạn mặc định 1.25 MiB; LittleFS dùng phần Flash còn lại.
board_build.partitions = partitions_singleapp.csv
; Tạo ảnh full-flash cho Wokwi (bootloader + partition table + application).
extra_scripts = post:merge_firmware.py

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINOJSON_DECODE_UNICODE=0

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    links2004/WebSockets @ ^2.6.1
    bogde/HX711 @ ^0.7.5
    waspinator/AccelStepper @ ^1.64
    adafruit/Adafruit SSD1306 @ ^2.5.11
    adafruit/Adafruit GFX Library @ ^1.11.11
