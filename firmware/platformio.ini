[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Sử dụng hệ thống file LittleFS trên Flash để làm Offline Ring Buffer (SV2)
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts =
    pre:build_config.py
    post:merge_firmware.py

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINOJSON_DECODE_UNICODE=0

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    links2004/WebSockets @ ^2.6.1
    bogde/HX711 @ ^0.7.5
    waspinator/AccelStepper @ ^1.64
    adafruit/Adafruit SSD1306 @ ^2.5.11
    adafruit/Adafruit GFX Library @ ^1.11.11

[env:wokwi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D PETTY_USE_WOKWI_PRIVATE_GW=1

; Secure cloud target. build_config.py injects host, per-device token, and PEM CA
; from PETTY_WS_HOST, PETTY_DEVICE_TOKEN, and PETTY_ROOT_CA_FILE environment vars.
[env:production]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D PETTY_PRODUCTION=1
    -D PETTY_TLS=1
